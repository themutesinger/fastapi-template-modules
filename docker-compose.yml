services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-fastapi-template-v1:dev
    env_file:
      - .env
    environment:
      - APP_NAME=FastAPI Template
      - APP_ENV=dev
      - DEBUG=1
      - PORT=8000
      - LOG_LEVEL=INFO
      - ALLOWED_HOSTS=["localhost","127.0.0.1"]
      - CORS_ORIGINS=[]
      - DATABASE_URL=postgresql+asyncpg://app:app@db:5432/app
      - JWT_SECRET_KEY=dev-secret
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRES_MINUTES=30
      - COOKIE_NAME=session
      - COOKIE_SECURE=0
      - COOKIE_SAMESITE=lax
      - COOKIE_DOMAIN=
      - COOKIE_PATH=/
      - DB_PGBOUNCER_ENABLED=true
      - DB_PGBOUNCER_DSN=postgresql+asyncpg://app:app@pgbouncer:6432/app
      - DB_DSN=postgresql+asyncpg://app:app@db:5432/app
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_BUCKET=app-bucket
      - S3_SECURE=false
      - SENTRY_ENABLED=1
      - SENTRY_DSN=https://230de46516c39c995ddbbded8507865a@sentry.mdigital.kg/114
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health/ready" ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s
    volumes:
      - ./src:/app/src
    depends_on:
      - db
      - redis
      - minio
      - pgbouncer
    networks:
      - backend

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-fastapi-template-v1:dev
    env_file:
      - .env
    environment:
      - PYTHONPATH=src
    command: sh -lc "python -m pip install -q pytest pytest-asyncio && python -m pytest -q"
    depends_on:
      - db
      - redis
    profiles: ["tests"]
    networks:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5440:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    networks:
      - backend

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASES: "app=host=db port=5432 user=app password=app dbname=app"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6433:6432"
    depends_on:
      - db
    networks:
      - backend

volumes:
  db_volume:
  redis_data:
  minio-data:

networks:
  backend:
    driver: bridge
