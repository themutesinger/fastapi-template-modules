version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-fastapi-template-v1:dev
    environment:
      - DEBUG=1
      - APP_ENV=dev
      - DB_PGBOUNCER_ENABLED=true
      - DB_PGBOUNCER_DSN=postgresql+asyncpg://app:app@pgbouncer:6432/app
      - DB_DSN=postgresql+asyncpg://app:app@db:5432/app
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_BUCKET=app-bucket
      - S3_SECURE=false
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
      - minio
      - pgbouncer
    networks:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5440:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    networks:
      - backend

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASES: "app=host=db port=5432 user=app password=app dbname=app"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6433:6432"
    depends_on:
      - db
    networks:
      - backend

volumes:
  db_volume:
  redis_data:
  minio-data:

networks:
  backend:
    driver: bridge
